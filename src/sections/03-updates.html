{# Updates: what changed and when, newest first. The list starts with the day the release went online. #}
<section id="updates" class="sec s-updates" data-section="updates" aria-labelledby="updates-h">
  <div class="wrap">
    <h2 id="updates-h" class="s-updates__h" data-reveal>Updates</h2>
    <ol class="s-updates__list" data-reveal>
      <li class="s-updates__item is-new">
        <time datetime="2026-11-20">Nov 20, 2026</time>
        <p>{{ site.name | e }} is online: the <a href="{{ site.links.hf | e }}" rel="noopener">data</a> on Hugging Face, the <a href="{{ site.links.github | e }}" rel="noopener">code</a> on GitHub, and the <a href="#benchmark">benchmark results</a> on this page.</p>
      </li>
    </ol>
  </div>
</section>
